<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let's Learn And Play</title>
<meta name="description" content="Classroom quiz games: teachers host with a code, students join with just their name.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=Cairo:wght@600;700;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>html{background:#170d3a}
:root{--bg1:#170d3a;--bg2:#3a1c8c;--ink:#1d1640;--muted:#6b6790;--pri:#7c3aed;--pri-d:#5b21b6;--pink:#ff4d8d;--yellow:#ffc93c;--green:#10c98f;--blue:#3a86ff;--red:#ff4d6d;--orange:#ff8c42;--line:#ece8fb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 15% -10%,#6d38f0 0,transparent 45%),radial-gradient(circle at 95% 25%,#ff4d8d40 0,transparent 40%),radial-gradient(circle at 50% 110%,#10c98f30 0,transparent 45%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
h1,h2,h3,.disp{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;letter-spacing:.3px;margin:0}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:8px 16px 60px}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1120px;margin:0 auto}
.logo{font-family:'Lilita One';font-size:24px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;text-shadow:0 3px 0 #0005;user-select:none}
.logo .y{color:var(--yellow)} .logo .p{color:#ff8fb8}
.chip{display:flex;align-items:center;gap:8px;background:#ffffff1f;color:#fff;padding:4px 12px 4px 4px;border-radius:99px;font-weight:800;font-size:14px;cursor:pointer}
.chip img{width:30px;height:30px;border-radius:50%;background:#fff}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 7px 0 #00000026,0 18px 40px #0000002e}
.card+.card{margin-top:16px}
.btn{font-weight:900;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;color:#fff;background:var(--pri);box-shadow:0 5px 0 var(--pri-d);transition:transform .08s,box-shadow .08s,filter .15s;font-size:16px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.g{background:var(--green);box-shadow:0 5px 0 #08976a}
.btn.y{background:var(--yellow);color:#4a3200;box-shadow:0 5px 0 #c9971a}
.btn.p{background:var(--pink);box-shadow:0 5px 0 #c42a63}
.btn.b{background:var(--blue);box-shadow:0 5px 0 #2160c9}
.btn.r{background:var(--red);box-shadow:0 5px 0 #c42a45}
.btn.ghost{background:#efeafd;color:var(--pri-d);box-shadow:0 5px 0 #d6cbf7}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.big{padding:16px 28px;font-size:20px}
.btn.wide{width:100%}
input,select,textarea{font:inherit;font-weight:700;border:2.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;color:var(--ink);background:#faf9ff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:170px;resize:vertical;font-weight:600}
label{font-weight:900;font-size:13px;color:var(--muted);display:block;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.center{text-align:center}
.h-white{color:#fff;text-shadow:0 3px 0 #0004}
.sec-title{color:#fff;margin:26px 0 12px;font-size:24px;text-shadow:0 3px 0 #0004;display:flex;align-items:center;gap:10px}
.sec-title small{font-family:Nunito;font-size:14px;opacity:.8;font-weight:800}
.hero{text-align:center;color:#fff;padding:26px 10px 18px}
.hero h1{font-size:clamp(38px,7vw,72px);line-height:1;text-shadow:0 6px 0 #0005}
.hero h1 .y{color:var(--yellow)} .hero h1 .p{color:#ff8fb8} .hero h1 .g{color:#5ff2c4}
.hero p{font-weight:800;font-size:18px;opacity:.9;margin:12px 0 0}
.float{display:inline-block;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.tile{border-radius:20px;padding:18px;color:#fff;cursor:pointer;box-shadow:0 6px 0 #0003;transition:transform .12s;position:relative;overflow:hidden;min-height:120px}
.tile:hover{transform:translateY(-3px) rotate(-.5deg)}
.tile .em{font-size:40px;line-height:1}
.tile h3{font-size:22px;margin-top:8px}
.tile small{font-weight:800;opacity:.9}
.mode{border-radius:20px;padding:16px;background:#fff;cursor:pointer;box-shadow:0 6px 0 #0002;border:3px solid transparent;transition:transform .12s}
.mode:hover{transform:translateY(-3px);border-color:var(--pri)}
.mode .em{font-size:38px}
.mode h3{font-size:21px;margin:6px 0 2px}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:#efeafd;color:var(--pri-d);text-transform:uppercase;letter-spacing:.5px}
.tag.ga{background:#ffe3ef;color:#c42a63}
.tag.wg{background:#ddf7ee;color:#08765a}
.lv{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;color:#fff}
.lv1{background:#10c98f}.lv2{background:#ff8c42}.lv3{background:#7c3aed}
.bigcode{font-family:'Lilita One';font-size:clamp(54px,11vw,110px);letter-spacing:8px;color:var(--pri-d);line-height:1;margin:6px 0}
.plgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.pl{background:#fff;border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:900;box-shadow:0 4px 0 #0002;animation:pop .35s}
.pl .av{font-size:26px}
.pl select{width:auto;padding:4px 6px;font-size:12px;border-radius:8px}
.x{border:0;background:#ffe3e8;color:#c42a45;border-radius:8px;cursor:pointer;font-weight:900;padding:3px 7px}
@keyframes pop{0%{transform:scale(.6);opacity:0}80%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{background:#ffffff22;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:900;cursor:pointer;font-size:15px}
.tab.on{background:#fff;color:var(--pri-d)}
.lb{display:flex;flex-direction:column;gap:8px}
.lbr{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;font-weight:900;box-shadow:0 4px 0 #0001;border:2px solid var(--line)}
.lbr.me{border-color:var(--yellow);background:#fffbea}
.lbr .rk{width:34px;text-align:center;font-family:'Lilita One';font-size:20px;color:var(--muted)}
.lbr .av{font-size:26px}
.lbr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .sc{font-family:'Lilita One';font-size:18px;color:var(--pri-d);white-space:nowrap}
/* play */
.playbar{display:flex;align-items:center;gap:10px;color:#fff;font-weight:900;margin:4px 0 12px;flex-wrap:wrap}
.pill{background:#ffffff22;border-radius:99px;padding:7px 14px;font-size:15px}
.pill.y{background:var(--yellow);color:#4a3200}
.playgrid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:860px){.playgrid{grid-template-columns:1fr}}
.qcard{background:#fff;border-radius:24px;padding:24px;box-shadow:0 7px 0 #0003;min-height:150px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.qtext{font-size:clamp(20px,3vw,30px);font-weight:900;line-height:1.25}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:560px){.answers{grid-template-columns:1fr}}
.ans{border:0;border-radius:18px;padding:20px 16px;color:#fff;font-weight:900;font-size:clamp(16px,2.2vw,21px);cursor:pointer;min-height:86px;box-shadow:0 6px 0 #0003;display:flex;align-items:center;gap:12px;text-align:left;transition:transform .08s,opacity .2s}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.ans{text-align:start}
.ans .sh{font-size:22px;opacity:.85}
.ans.c0{background:#ff4d6d}.ans.c1{background:#3a86ff}.ans.c2{background:#f5a623}.ans.c3{background:#10c98f}
.ans.dim{opacity:.35}.ans.right{outline:5px solid #fff;box-shadow:0 0 0 9px #10c98f}.ans.gone{visibility:hidden}
.tbar{height:10px;border-radius:99px;background:#efeafd;margin-top:16px;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .2s linear}
.pups{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pup{border:0;border-radius:12px;padding:8px 12px;font-weight:900;cursor:pointer;background:#fff3c4;color:#6b4b00;box-shadow:0 4px 0 #e6c552}
.fb{border-radius:24px;padding:30px 20px;text-align:center;color:#fff;cursor:pointer;animation:pop .3s;box-shadow:0 7px 0 #0003}
.fb.ok{background:linear-gradient(135deg,#10c98f,#0aa577)} .fb.no{background:linear-gradient(135deg,#ff4d6d,#d92b52)}
.fb h2{font-size:clamp(30px,5vw,48px)} .fb .sub{font-weight:900;font-size:20px;margin-top:8px}
.fb .ca{background:#ffffff26;border-radius:14px;padding:10px 14px;margin-top:14px;font-weight:800}
.choose{text-align:center;color:#fff}
.choose h2{font-size:clamp(24px,4vw,36px);text-shadow:0 3px 0 #0004;margin:10px 0 18px}
.copts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.copt{border:0;background:#fff;border-radius:20px;padding:18px 20px;min-width:150px;font-weight:900;font-size:20px;cursor:pointer;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);animation:pop .35s;transition:transform .1s}
.copt:hover{transform:translateY(-4px) scale(1.03)}
.copt b{font-family:'Lilita One';font-size:28px;font-weight:400}
.copt small{font-size:13px;color:var(--muted)}
.copt.chest{font-size:64px;min-width:130px;padding:20px}
.side .card{padding:16px}
.mystat{font-family:'Lilita One';font-size:30px;color:var(--pri-d);text-align:center;line-height:1.1}
.subt{text-align:center;font-weight:900;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.track{position:relative;background:#f3f0ff;border-radius:14px;padding:8px 34px 8px 8px;margin-top:10px}
.track.obby{background:repeating-linear-gradient(90deg,#e7f9f1 0 18px,#d2f3e5 18px 36px)}
.lane{position:relative;height:34px;border-bottom:2px dashed #d8d0f5}
.lane:last-of-type{border-bottom:0}
.lane .car{position:absolute;top:2px;font-size:24px;transition:left .5s cubic-bezier(.3,1.6,.6,1)}
.lane .ln{position:absolute;right:0;top:8px;font-size:11px;font-weight:900;color:var(--muted)}
.lane.me .ln{color:var(--pri-d)}
.finish{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:22px}
.hpbar{height:16px;border-radius:99px;background:#ffe3e8;overflow:hidden;margin-top:8px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ff8c42,#10c98f);transition:width .4s}
.inv{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:22px;margin-top:8px}
.r-common{filter:grayscale(.3)} .rar{font-size:11px;font-weight:900;padding:2px 8px;border-radius:99px;color:#fff}
.rar.Common{background:#9aa0b5}.rar.Rare{background:#3a86ff}.rar.Epic{background:#9b5de5}.rar.Legendary{background:#f5a623}.rar.Mythic{background:linear-gradient(90deg,#ff4d8d,#7c3aed,#3a86ff)}
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;width:min(92vw,440px);pointer-events:none}
.toast{background:#1d1640;color:#fff;font-weight:900;border-radius:14px;padding:12px 16px;box-shadow:0 8px 24px #0005;animation:pop .3s;text-align:center}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}
.modal .card{max-width:520px;width:100%}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #d6cbf7;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.avb{font-size:30px;border:3px solid var(--line);background:#faf9ff;border-radius:14px;padding:6px;cursor:pointer}
.avb.on{border-color:var(--pri);background:#efeafd;transform:scale(1.08)}
.lvcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.lvcards{grid-template-columns:1fr}}
.lvc{border:3px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:center;font-weight:900;background:#faf9ff}
.lvc.on{border-color:var(--pri);background:#efeafd}
.lvc .em{font-size:30px}
.qlist .qi{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.qlist .qi .t{flex:1}
.qlist .opt{display:inline-block;margin:4px 6px 0 0;padding:3px 9px;border-radius:8px;background:#f3f0ff;font-size:13px;font-weight:800}
.qlist .opt.ok{background:#d7f8ea;color:#08765a}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-weight:700;vertical-align:top}
.pct{display:inline-block;min-width:48px;text-align:center;padding:3px 8px;border-radius:8px;font-weight:900;color:#fff}
.dots{display:flex;flex-wrap:wrap;gap:3px;max-width:340px}
.dot{width:18px;height:18px;border-radius:5px;background:#e8e5f3;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.dot.ok{background:#10c98f}.dot.no{background:#ff4d6d}.dot.mix{background:#f5a623}
.stat{background:#f6f3ff;border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-family:'Lilita One';font-size:30px;font-weight:400;color:var(--pri-d)}
.stat span{font-weight:900;font-size:12px;color:var(--muted);text-transform:uppercase}
.feed{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.fd{display:flex;gap:10px;align-items:center;border-radius:12px;padding:8px 12px;background:#faf9ff;border-inline-start:5px solid #ccc;font-weight:700;font-size:14px}
.fd.ok{border-inline-start-color:#10c98f}.fd.no{border-inline-start-color:#ff4d6d}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:20px 0}
.pod{background:#fff;border-radius:18px 18px 6px 6px;text-align:center;padding:12px;width:150px;box-shadow:0 6px 0 #0003}
.pod .av{font-size:44px}.pod .md{font-size:34px}
.pod.p1{min-height:210px;background:linear-gradient(#fff,#fff3c4)}.pod.p2{min-height:170px}.pod.p3{min-height:140px}
.banner{background:#fff3c4;border-radius:14px;padding:10px 14px;font-weight:900;color:#6b4b00;margin-bottom:12px;text-align:center}
.rev{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:9px 0;font-weight:700}
.bounce{display:inline-block;animation:bn 1s infinite}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.floaty{position:fixed;pointer-events:none;font-family:'Lilita One';font-size:34px;color:var(--yellow);text-shadow:0 3px 0 #0006;animation:up 1.2s forwards;z-index:60}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}
.link{color:var(--pri);font-weight:900;cursor:pointer;text-decoration:underline}
.empty{padding:26px;text-align:center;color:var(--muted);font-weight:800}
html[lang=ar] body{font-family:Cairo,Nunito,system-ui,sans-serif}
html[lang=ar] h1,html[lang=ar] h2,html[lang=ar] h3,html[lang=ar] .disp,html[lang=ar] .logo,html[lang=ar] .bigcode,html[lang=ar] .mystat,html[lang=ar] .lbr .rk,html[lang=ar] .lbr .sc,html[lang=ar] .copt b,html[lang=ar] .stat b,html[lang=ar] .pod b{font-family:Lalezar,'Lilita One',Cairo,sans-serif;letter-spacing:0;font-weight:400}
html[lang=ar] .bigcode{font-family:'Lilita One',sans-serif;letter-spacing:8px}
html[lang=ar] label{letter-spacing:0}
.nt{unicode-bidi:plaintext}
.qtext,.ans,.qlist .t{unicode-bidi:plaintext}
.track{direction:ltr}
.langb{margin-inline-start:auto;background:#ffffff22;color:#fff;border:0;border-radius:99px;padding:8px 14px;font-weight:900;cursor:pointer;font-size:14px;font-family:Cairo,Nunito,sans-serif}
.langb:hover{background:#ffffff38}

.demo{display:none;background:#ffc93c;color:#4a3200;text-align:center;font-weight:800;padding:6px 10px;font-size:14px}
.gbtn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f1f1f;border:2px solid #dadce0;border-radius:12px;padding:11px 20px 11px 14px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 #0002;font-family:Roboto,Nunito,Cairo,sans-serif;transition:transform .08s}
.gbtn:hover{background:#f8f9ff}.gbtn:active{transform:translateY(3px)}.gbtn svg{width:22px;height:22px}
.qmedia{margin:0 auto 12px;display:flex;justify-content:center}
.qmedia img{max-width:100%;max-height:240px;border-radius:16px;box-shadow:0 4px 0 #0002;background:#f3f0ff;min-width:60px;min-height:60px}
.qpic{font-size:64px;line-height:1.15;animation:fl 3s ease-in-out infinite}
.thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#f3f0ff;flex:none}
.thumbpic{width:72px;height:72px;border-radius:12px;background:#f3f0ff;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.qtools{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.emo{width:76px;text-align:center;font-size:20px;padding:6px}
.linkbox{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.linkbox input{max-width:420px;font-size:14px;direction:ltr}
.qr img{width:180px;height:180px;border-radius:14px;background:#fff;padding:8px;box-shadow:0 4px 0 #0002}
.lobbygrid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
@media(max-width:700px){.lobbygrid{grid-template-columns:1fr}}
.tog{display:flex;align-items:center;gap:10px;font-weight:800;margin:10px 0;cursor:pointer;color:var(--ink);text-transform:none;letter-spacing:0;font-size:15px}
.tog input{width:22px;height:22px;accent-color:var(--pri)}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{border:2.5px solid var(--line);background:#faf9ff;border-radius:12px;padding:8px 12px;font-weight:900;cursor:pointer;font-size:14px;color:var(--ink)}
.mchip.on{border-color:var(--pri);background:#efeafd;color:var(--pri-d)}
.making{text-align:center;padding:30px}
.making .big{font-size:76px;display:inline-block;animation:bn 1s infinite}
.conf{position:fixed;top:-40px;pointer-events:none;z-index:70;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg);opacity:.6}}
.filerow{background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;margin-top:6px}
.dropz.over{border-color:var(--pri)!important;background:#efeafd!important}
.chip span.link{text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="demo nt" id="demo">🧪 Demo mode — everything stays in this browser. Add your Firebase settings to <b>config.js</b> to go live (see README).</div>
<div class="top"><div class="logo" onclick="home()">🎮 Let's <span class="y">Learn</span> And <span class="p">Play</span></div><button class="langb nt" id="langb" onclick="toggleLang()">🌐 عربي</button><div id="chip"></div></div>
<div class="wrap" id="app"></div>

async function firebaseBackend(cfg){

 const dref=r=>({id:r.id,path:r.path,get:async()=>wrapDoc(await fs.getDoc(r)),set:d=>fs.setDoc(r,clean(d)),update:d=>fs.updateDoc(r,clean(d)),delete:()=>fs.deleteDoc(r),

function localBackend(){ /* demo mode: data lives in this browser; tabs sync with each other */
 const PFX='llp_demo:';let store={};
 const load=()=>{const s={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PFX)){try{s[k.slice(PFX.length)]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}catch(e){}store=s};load();
 const subs=new Set();const notify=()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}});
 const bc=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('llp_demo'):null;if(bc)bc.onmessage=()=>{load();notify()};
 window.addEventListener('storage',e=>{if(!e.key||e.key.startsWith(PFX)){load();notify()}});setInterval(()=>{load();notify()},900);
 const put=(path,val)=>{try{if(val===undefined)localStorage.removeItem(PFX+path);else localStorage.setItem(PFX+path,JSON.stringify(val))}catch(e){}if(val===undefined)delete store[path];else store[path]=val};
 const changed=()=>{bc&&bc.postMessage(1);setTimeout(notify,0)};
 const fresh=path=>{try{const v=localStorage.getItem(PFX+path);return v==null?undefined:JSON.parse(v)}catch(e){return undefined}};
 const parent=p=>p.split('/').slice(0,-1).join('/');const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
 const newId=()=>Math.random().toString(36).slice(2,11)+Date.now().toString(36).slice(-5);
 const setPath=(obj,key,val)=>{const ks=key.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val};
 const wrap=(path,d)=>({id:path.split('/').pop(),exists:d!==undefined,data:()=>clone(d)});
 const dref=path=>({id:path.split('/').pop(),path,get:async()=>{store[path]=fresh(path);if(store[path]===undefined)delete store[path];return wrap(path,store[path])},set:async d=>{put(path,clone(d));changed()},
  update:async d=>{const cur=fresh(path);if(!cur)throw{code:'not-found',message:'No document'};for(const k in d)setPath(cur,k,clone(d[k]));put(path,cur);changed()},
  delete:async()=>{put(path,undefined);changed()},
  onSnapshot:cb=>{let last=null;const f=()=>{const j=JSON.stringify(store[path]??null);if(j!==last){last=j;cb(wrap(path,store[path]))}};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
  collection:p=>cref(path+'/'+p)});
 const qref=(col,filters)=>{filters=filters||[];const run=()=>Object.keys(store).filter(k=>parent(k)===col&&filters.every(([f,op,v])=>op!=='=='||store[k][f]===v)).map(k=>wrap(k,store[k]));
  return{where:(f,op,v)=>qref(col,filters.concat([[f,op,v]])),limit:()=>qref(col,filters),
   get:async()=>{const docs=run();return{docs,size:docs.length,empty:!docs.length,docChanges:()=>docs.map(d=>({type:'added',doc:d}))}},
   onSnapshot:cb=>{let prev=null;const f=()=>{const docs=run();const cur={};docs.forEach(d=>cur[d.id]=JSON.stringify(d.data()));const ch=[];const p0=prev||{};
     docs.forEach(d=>{if(!(d.id in p0))ch.push({type:'added',doc:d});else if(p0[d.id]!==cur[d.id])ch.push({type:'modified',doc:d})});
     Object.keys(p0).forEach(id=>{if(!(id in cur))ch.push({type:'removed',doc:wrap(col+'/'+id,JSON.parse(p0[id]))})});
     if(ch.length||prev===null){prev=cur;cb({docs,size:docs.length,empty:!docs.length,docChanges:()=>ch})}};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}};
 const cref=col=>Object.assign(qref(col),{path:col,doc:id=>dref(col+'/'+(id||newId())),add:async d=>{const r=dref(col+'/'+newId());await r.set(d);return r}});
 let user=null;try{user=JSON.parse(sessionStorage.getItem('llp_demo_user'))}catch(e){}
 const aSubs=new Set();const setU=u=>{user=u;try{sessionStorage.setItem('llp_demo_user',JSON.stringify(u))}catch(e){}aSubs.forEach(f=>f(u));return u};
 return{demo:true,db:{doc:dref,collection:cref},auth:{onChange:cb=>{aSubs.add(cb);setTimeout(()=>cb(user),0);return()=>aSubs.delete(cb)},
  google:async()=>setU({uid:'t_'+newId(),name:'Demo Teacher',photo:'',teacher:true}),anon:async()=>setU({uid:'s_'+newId(),name:'',photo:'',teacher:false}),
  signOut:async()=>setU(null),token:async()=>null}};
}
async function callAI(body){
 if(B.demo)throw{message:'AI question-making works after you put the website online (see README). In demo mode, use the Topic library.'};
 const tok=await B.auth.token();
 const r=await fetch(CFG.aiEndpoint||'/api/generate',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+(tok||'')},body:JSON.stringify(body)});
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok)throw{message:(j&&j.error)||('server error '+r.status)};
 return j}

const KIND_EM={pptx:'📽️',pdf:'📄',docx:'📝',xlsx:'📊',image:'🖼️',text:'📃'};
function fileKindOf(f){const n=(f.name||'').toLowerCase(),t=f.type||'';
 if(/\.pptx$/.test(n)||/presentationml/.test(t))return 'pptx';if(/\.pdf$/.test(n)||t==='application/pdf')return 'pdf';
 if(/\.docx$/.test(n)||/wordprocessingml/.test(t))return 'docx';if(/\.xlsx$/.test(n)||/spreadsheetml/.test(t))return 'xlsx';
 if(/\.(ppt|doc|xls)$/.test(n))return 'old';if(/\.(heic|heif)$/.test(n)||/heic|heif/.test(t))return 'heic';
 if(/^image\//.test(t)||/\.(jpe?g|png|webp|gif|bmp|avif)$/.test(n))return 'image';
 if(/^text\//.test(t)||/\.(txt|md|csv|json|html?|rtf|xml)$/.test(n))return 'text';return 'unknown'}
function mergeFiles(){const fs=S.lessonFiles||[];if(!fs.length){S.lessonPdf=null;return}
 const imgs=[];fs.forEach(f=>f.images.forEach(b=>imgs.push(b)));const cap=10;
 const images=imgs.length<=cap?imgs:Array.from({length:cap},(_,k)=>imgs[Math.round(k*(imgs.length-1)/(cap-1))]);
 S.lessonPdf={kind:fs.every(f=>f.kind==='pptx')?'pptx':(fs.length===1&&fs[0].kind==='pdf'?'pdf':'files'),name:fs.map(f=>f.name).join(', ').slice(0,200),pages:fs.reduce((s,f)=>s+(f.pages||1),0),
  text:fs.map(f=>f.text?`=== ${f.name} ===\n${f.text}`:'').filter(Boolean).join('\n\n').slice(0,40000),images,notes:fs.some(f=>f.notes)}}
function pdfBoxHTML(){const fs=S.lessonFiles||[];let h=fs.map((d,i)=>`<div class="row filerow"><span>${KIND_EM[d.kind]||'📎'} <span class="nt">${esc(d.name)}</span> · ${d.kind==='image'?'picture':`${d.pages} ${d.kind==='pptx'?(d.pages===1?'slide':'slides'):(d.pages===1?'page':'pages')}`}${d.text.length>40?' · text ✓':''}${d.notes?' · speaker notes ✓':''}${d.images.length&&d.kind!=='image'?` · ${d.images.length} pictures`:''}</span><button class="x" style="margin-inline-start:auto" title="Remove" onclick="removeLessonFile(${i})">✕</button></div>`).join('');
 if(S.pdfBusy)h+=`<div class="muted" style="font-weight:800;margin-top:6px">${spinner} <span id="pdfprog">Reading your file…</span></div>`;return h}
function refreshFileBox(){const b=$('#pdfbox');if(b)b.innerHTML=pdfBoxHTML()}
function removeLessonFile(i){S.lessonFiles.splice(i,1);mergeFiles();refreshFileBox()}
function pdfProg(t){const e=$('#pdfprog');if(e)e.textContent=t}
async function handleLessonFiles(list){const files=Array.from(list||[]);if(!files.length)return;if(S.pdfBusy)return toast('Still reading your file — one moment 📄');
 S.lessonFiles=S.lessonFiles||[];if(S.lessonFiles.length+files.length>10)return toast('Up to 10 files at a time');
 S.pdfBusy=true;refreshFileBox();
 let okN=0;for(const f of files){try{const d=await readLessonFile(f);if(d){S.lessonFiles.push(d);okN++}}catch(e){toast(`Couldn't read ${f.name||'that file'}: ${(e&&e.message)||'try another file'}`,5500)}}

 S.pdfBusy=false;mergeFiles();refreshFileBox()}
function handleLessonFile(f){return handleLessonFiles([f])}
async function readLessonFile(f){const k=fileKindOf(f);
 if(k==='old'){modal(`<h2>📁 Old file type</h2><p><b>${esc(f.name)}</b> is an old Office file (.ppt, .doc or .xls). Open it in PowerPoint, Word or Excel and choose <b>File → Save As</b> → the new format (<b>.pptx</b>, <b>.docx</b> or <b>.xlsx</b>), or save it as <b>PDF</b>, then upload that.</p><button class="btn" onclick="closeModal()">OK</button>`);return null}
 if(k==='heic')throw new Error('iPhone HEIC photos need to be JPG — on the iPhone choose Settings → Camera → Formats → Most Compatible, or send yourself a screenshot');
 if(f.size>100*1024*1024)throw new Error('the file is over 100 MB');
 if(k==='pptx')return readPptx(f);if(k==='pdf')return readPdf(f);if(k==='docx')return readDocx(f);if(k==='xlsx')return readXlsx(f);
 if(k==='image'){pdfProg('Preparing pictures…');const b=await toJpeg(f,1000,.8);return{kind:'image',name:f.name||'picture.jpg',pages:1,text:'',images:[b]}}
 if(k==='text'){if(f.size>3e6)throw new Error('the text file is too big');let t=await f.text();if(/\.html?$/i.test(f.name)||/^\s*</.test(t))t=new DOMParser().parseFromString(t.replace(/<\/(p|div|h\d|li|tr|td|section|article)>|<br\s*\/?>/gi,m=>m+'\n'),'text/html').body.textContent||'';if(/\.rtf$/i.test(f.name))t=t.replace(/\\[a-z]+-?\d* ?|[{}]/gi,' ');return{kind:'text',name:f.name,pages:1,text:t.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim().slice(0,30000),images:[]}}
 const t=await f.slice(0,200000).text();if(!t.trim()||/[\x00-\x08\x0E-\x1F]/.test(t.slice(0,2000)))throw new Error("this kind of file can't be read — use PowerPoint, PDF, Word, Excel, a picture or a text file");
 return{kind:'text',name:f.name,pages:1,text:t.slice(0,30000),images:[]}}
function pickEven(list,cap){return list.length<=cap?list:Array.from({length:cap},(_,k)=>list[Math.round(k*(list.length-1)/(cap-1))])}
async function zipPictures(zip,paths,cap){const cands=[];for(const mp of paths){const u8=await zip.file(mp).async('uint8array');if(u8.length<15000)continue;const ext=mp.split('.').pop().toLowerCase();cands.push(new Blob([u8],{type:ext==='png'?'image/png':ext==='gif'?'image/gif':ext==='webp'?'image/webp':'image/jpeg'}))}
 const out=[];const sel=pickEven(cands,cap);for(let k=0;k<sel.length;k++){pdfProg(`Preparing pictures… ${k+1}/${sel.length}`);try{const b=await toJpeg(sel[k],1000,.78);if(b)out.push(b)}catch(e){}}return out}
async function readPdf(f){const L=await loadPdfJs();const doc=await L.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false,useSystemFonts:true}).promise;
 const n=doc.numPages,maxP=Math.min(n,80);const parts=[];
 for(let i=1;i<=maxP;i++){pdfProg(`Reading your file… ${i}/${n}`);const pg=await doc.getPage(i);const tc=await pg.getTextContent();const t=tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim();if(t)parts.push(`[Page ${i}] ${t}`)}
 const text=parts.join('\n').slice(0,40000);const sel=pickEven(Array.from({length:n},(_,i)=>i+1),text.length>1500?6:8);const images=[];
 for(let k=0;k<sel.length;k++){pdfProg(`Preparing pictures… ${k+1}/${sel.length}`);try{const pg=await doc.getPage(sel[k]);const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2,1000/v1.width)});const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));if(b)images.push(b)}catch(e){}}
 if(!text&&!images.length)throw new Error('no readable text or pages');return{kind:'pdf',name:f.name,pages:n,text,images}}
function xmlParas(xml,pTag,tTag){pTag=pTag||'a:p';tTag=tTag||'a:t';const d=new DOMParser().parseFromString(xml,'application/xml');const out=[];const ps=d.getElementsByTagName(pTag);for(let i=0;i<ps.length;i++){const ts=ps[i].getElementsByTagName(tTag);let s='';for(let j=0;j<ts.length;j++)s+=ts[j].textContent;s=s.replace(/\s+/g,' ').trim();if(s)out.push(s)}return out}
function relTargets(xml){const out=[];const re=/<Relationship\b[^>]*>/g;let m;while((m=re.exec(xml))){const tag=m[0];const t=(tag.match(/Target="([^"]+)"/)||[])[1];const ty=(tag.match(/Type="([^"]+)"/)||[])[1]||'';const id=(tag.match(/Id="([^"]+)"/)||[])[1];if(t)out.push({id,t,ty})}return out}
function resolvePath(base,t){if(t.startsWith('/'))return t.slice(1);const parts=base.split('/');parts.pop();for(const seg of t.split('/')){if(seg==='..')parts.pop();else if(seg!=='.')parts.push(seg)}return parts.join('/')}
async function readPptx(f){const JSZip=await loadJsZip();const zip=await JSZip.loadAsync(await f.arrayBuffer());let slides=[];
 try{const pres=await zip.file('ppt/presentation.xml').async('string');const rels=relTargets(await zip.file('ppt/_rels/presentation.xml.rels').async('string'));const byId={};rels.forEach(r=>byId[r.id]=resolvePath('ppt/presentation.xml',r.t));
  const re=/<p:sldId\b[^>]*r:id="([^"]+)"/g;let m;while((m=re.exec(pres)))if(byId[m[1]]&&zip.file(byId[m[1]]))slides.push(byId[m[1]])}catch(e){}
 if(!slides.length)slides=Object.keys(zip.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/(\d+)\.xml/)[1])-parseInt(b.match(/(\d+)\.xml/)[1]));
 if(!slides.length)throw new Error('no slides found in this file');
 const parts=[];const media=[];let notesFound=false;
 for(let i=0;i<slides.length;i++){pdfProg(`Reading your file… ${i+1}/${slides.length}`);const sp=slides[i];const lines=xmlParas(await zip.file(sp).async('string'));let notes=[];
  const relF=zip.file(sp.replace(/slides\/(slide\d+\.xml)$/,'slides/_rels/$1.rels'));
  if(relF)for(const r of relTargets(await relF.async('string'))){const tp=resolvePath(sp,r.t);if(/notesSlide/.test(r.ty)&&zip.file(tp))notes=xmlParas(await zip.file(tp).async('string')).filter(s=>!/^\d+$/.test(s));else if(/\/image$/.test(r.ty)&&/\.(png|jpe?g|gif|webp)$/i.test(tp)&&zip.file(tp)&&!media.includes(tp))media.push(tp)}
  if(notes.length)notesFound=true;
  if(lines.length||notes.length)parts.push(`[Slide ${i+1}] ${lines.join(' | ')}${notes.length?`\n   (Speaker notes: ${notes.join(' ')})`:''}`)}
 const text=parts.join('\n').slice(0,40000);const images=await zipPictures(zip,media,text.length>1500?6:8);
 if(!text&&!images.length)throw new Error('no text or pictures found on the slides');return{kind:'pptx',name:f.name,pages:slides.length,text,images,notes:notesFound}}
async function readDocx(f){const JSZip=await loadJsZip();const zip=await JSZip.loadAsync(await f.arrayBuffer());const doc=zip.file('word/document.xml');if(!doc)throw new Error('this Word file looks damaged');
 pdfProg('Reading your file…');const paras=xmlParas(await doc.async('string'),'w:p','w:t');const text=paras.join('\n').slice(0,40000);
 const media=Object.keys(zip.files).filter(k=>/^word\/media\/.+\.(png|jpe?g|gif|webp)$/i.test(k));const images=await zipPictures(zip,media,text.length>1500?6:8);
 if(!text&&!images.length)throw new Error('no text or pictures found');return{kind:'docx',name:f.name,pages:Math.max(1,Math.round(text.length/2500)),text,images}}
async function readXlsx(f){const JSZip=await loadJsZip();const zip=await JSZip.loadAsync(await f.arrayBuffer());pdfProg('Reading your file…');let cells=[];
 const ss=zip.file('xl/sharedStrings.xml');if(ss){const d=new DOMParser().parseFromString(await ss.async('string'),'application/xml');const sis=d.getElementsByTagName('si');for(let i=0;i<sis.length;i++){const s=sis[i].textContent.replace(/\s+/g,' ').trim();if(s)cells.push(s)}}
 for(const k of Object.keys(zip.files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k))){const x=await zip.file(k).async('string');const re=/<is>[\s\S]*?<\/is>|<v>([^<]*)<\/v>/g;let m;while((m=re.exec(x))){const v=m[1]!==undefined?m[1]:m[0].replace(/<[^>]+>/g,'');if(v&&isNaN(+v))cells.push(v.trim())}}
 const text=[...new Set(cells)].join(' | ').slice(0,40000);const media=Object.keys(zip.files).filter(k=>/^xl\/media\/.+\.(png|jpe?g|gif|webp)$/i.test(k));const images=await zipPictures(zip,media,6);
 if(!text&&!images.length)throw new Error('no text found in this spreadsheet');return{kind:'xlsx',name:f.name,pages:1,text,images}}
document.addEventListener('paste',e=>{if(S.viewName!=='createView')return;const items=[...((e.clipboardData&&e.clipboardData.files)||[])].filter(x=>/^image\//.test(x.type));if(!items.length)return;e.preventDefault();handleLessonFiles(items.map((b,i)=>new File([b],`pasted-picture-${Date.now()}${i?'-'+i:''}.png`,{type:b.type})))});
const MAKING=['🎮','🧠','✨','🚀','🎨','🏆','🎲','💡'];

async function generateAI(){
 const f=readAiForm();if(S.pdfBusy)return toast('Still reading your file — one moment 📄');mergeFiles();const pdf=S.lessonPdf;
 if(f.lesson.trim().length<15&&!pdf)return toast('Upload your lesson or type a topic first ✍️');
 go(makingView);let k=0;const iv=setInterval(()=>{k++;const e=$('#mkem');if(e)e.textContent=MAKING[k%MAKING.length];const b=$('#mkbar');if(b)b.style.width=Math.min(95,5+k*2.4)+'%'},1000);
 try{
  const imgs=[];let total=0;for(const b of (pdf?pdf.images:[])){const d=(await blobToDataURL(b)).split(',')[1];if(total+d.length>1800000)break;total+=d.length;imgs.push(d)}
  const out=await callAI({kind:'lesson',lesson:f.lesson.slice(0,30000),file:pdf?{name:pdf.name,kind:pdf.kind,pages:pdf.pages,text:pdf.text}:null,grade:f.grade,n:f.n,lang:f.lang,images:imgs});
  const qs=[];
  for(const r of (out&&out.questions)||[]){
   if(!r||typeof r.q!=='string'||!Array.isArray(r.options))continue;
   const opts=r.options.map(x=>String(x)).filter(Boolean).slice(0,4);const ai=Number.isInteger(r.answer)?r.answer:parseInt(r.answer,10);
   if(opts.length<2||!(ai>=0&&ai<opts.length))continue;
   const q=mkQ([1,2,3].includes(+r.level)?+r.level:2,r.q.slice(0,300),opts[ai],opts.filter((_,j)=>j!==ai),String(r.explanation||'').slice(0,300),String(r.pic||'').slice(0,12));
   const ii=parseInt(r.image,10);if(ii>=1&&pdf&&pdf.images[ii-1]&&ii<=imgs.length){try{q.imgData=await blobToDataURL(await toJpeg(pdf.images[ii-1],640,.75))}catch(e){}}
   qs.push(q)}
  if(!qs.length)throw{message:'no usable questions came back — try again'};
  const tp=f.topic==='auto'?(TOPIC_BY[out.topic]?out.topic:'other'):f.topic;
  S.aiSet={title:f.title||(out&&out.title)||(pdf?pdf.name.split(',')[0].replace(/\.[a-z0-9]+$/i,''):'My Lesson'),topic:tp,grade:f.grade,questions:qs};
  clearInterval(iv);confetti(20);go(aiPreviewView);
 }catch(e){clearInterval(iv);go(createView);toast('😕 Could not make the game: '+((e&&e.message)||'try again'),6000)}}

function auraTitle(a){return a<0?'Negative Aura 💀':a<500?'NPC 🧍':a<1500?'Main Character 🌟':a<3000?'Sigma 🗿':a<6000?'Aura Legend 👑':'Infinite Aura ♾️'}
function streamBadge(f){return f<100?'New Streamer 📷':f<1000?'Rising Star ⭐':f<10000?'Influencer 💫':f<100000?'Viral Icon 🔥':'Mega Creator 👑'}
function others(){return Object.values(S.players).filter(p=>p.uid!==S.uid)}
function bal(uid){const p=S.players[uid];let b=(p&&p.stats&&p.stats.earned)||0;for(const h of S.hits){if(h.kind!=='xfer')continue;if(h.by===uid)b+=h.amt;if(h.target===uid)b-=h.amt}return b}
function hp(uid){const st=(S.players[uid]&&S.players[uid].stats)||{};let v=100+(st.heal||0)-(st.selfDmg||0);for(const h of S.hits)if(h.kind==='dmg'&&h.target===uid)v-=h.amt;return v}
function kos(uid){return S.hits.filter(h=>h.kind==='dmg'&&h.by===uid&&h.ko).length}
function addHit(h){const d=Object.assign({by:S.uid,at:Date.now()},h);S.hits.push(d);S.db.collection(`games/${S.code}/hits`).add(d).catch(writeErr)}
function targetOpts(list,label){return list.slice(0,6).map(p=>({html:`<span style="font-size:34px">${p.avatar}</span><span class="nt">${esc(nm(p))}</span><small>${label(p)}</small>`,v:p.uid}))}
const goalShow=p=>p.stats.fin?'🏁 Finished!':`${p.stats.pos||0}/${S.game.goal}`;
const goalScore=p=>(p.stats.fin?1e13-p.stats.fin:0)+(p.stats.pos||0);
const MODES={
classic:{cat:'game',name:'Quiz Show',emoji:'🎤',desc:'Timed questions with a speed bonus, streaks, memes and power-ups (50/50, ×2, Time Freeze, Streak Saver).',finite:true,
 init:()=>({pts:0,power:[]}),
 correct(st,c){let g=600+Math.max(0,Math.round(400*(1-c.t/(c.T||20000))));g+=100*Math.min(st.streak-1,5);if(st.x2){g*=2;st.x2=false}st.pts+=g;let x='';if(st.streak%3===0&&(st.power||[]).length<3){const k=pick(Object.keys(PU));st.power=(st.power||[]).concat(k);x=` · Power-up: ${PU[k].em} ${PU[k].name}`}return `+${g} pts${x}`},
 wrong(st,c,prev){if(st.saver){st.saver=false;st.streak=prev;return '🛟 Streak Saver kept your streak!'}return 'Streak reset'},
 score:p=>p.stats.pts||0,show:p=>fmt(p.stats.pts)+' pts'},
royale:{cat:'game',name:'Last One Standing',emoji:'⚔️',desc:'Every right answer lets you blast a classmate. Lose all your HP and you\'re out — get 3 right in a row to revive.',
 init:()=>({heal:0,selfDmg:0,revive:0}),
 correct(st){if(hp(S.uid)<=0){st.revive=(st.revive||0)+1;if(st.revive>=3){st.heal+=40-hp(S.uid);st.revive=0;return '🔄 REVIVED with 40 HP!'}return `Revive ${st.revive}/3`}return st.streak>=3?'🔥 Critical blast ready!':'Blast ready!'},
 wrong(st){if(hp(S.uid)>0){st.selfDmg+=10;return '−10 HP'}st.revive=0;return 'Revive progress reset'},
 async reward(st){if(hp(S.uid)<=0)return;const dmg=st.streak>=3?30:20;const foes=shuffle(others().filter(p=>hp(p.uid)>0));const opts=targetOpts(foes,p=>'❤️ '+hp(p.uid));if(hp(S.uid)<100)opts.push({html:'<span style="font-size:34px">🛡️</span>Heal<small>+15 HP</small>',v:'heal'});
  if(!opts.length){st.bonus=(st.bonus||0)+10;return toast('👑 Nobody left to blast!')}
  const v=await choose(`💥 Blast someone for ${dmg} damage!`,opts);if(v==='heal'){st.heal+=Math.min(15,100-hp(S.uid));return toast('🛡️ Healed!')}
  const ko=hp(v)-dmg<=0;addHit({kind:'dmg',target:v,amt:dmg,ko});toast(ko?`💀 You knocked out ${nm(S.players[v])}!`:`💥 Hit ${nm(S.players[v])} for ${dmg}!`)},
 extra(p){const h=Math.max(0,hp(p.uid));return `<div class="hpbar"><i style="width:${Math.min(100,h)}%"></i></div>${h<=0?`<div class="subt" style="margin-top:6px">💀 Out! Revive: ${p.stats.revive||0}/3 right in a row</div>`:''}`},
 score:p=>{const h=hp(p.uid);return (h>0?1e5+h*10:0)+kos(p.uid)*500+(p.stats.correct||0)},
 show:p=>{const h=hp(p.uid);return h>0?`❤️ ${h} · 💀 ${kos(p.uid)}`:`☠️ OUT · ${kos(p.uid)} KOs`}},
hack:{cat:'game',name:'Code Breaker',emoji:'💻',desc:'Right answers crack passwords for coins — or HACK a classmate and steal 20% of their coins.',
 init:()=>({earned:0}),
 async reward(st){const pool=[20,40,60,80,100,120,150,200,250,300].slice(0,6+Math.min(4,st.streak));const a=pick(pool),b=pick(pool),c=pick(pool);const tg=others().filter(p=>bal(p.uid)>0);
  const opts=[{html:`🔐<b>+${a}</b><small>coins</small>`,v:a},{html:`🔐<b>+${b}</b><small>coins</small>`,v:b},tg.length?{html:'💻<b>HACK</b><small>steal 20%</small>',v:'hack'}:{html:`🔐<b>+${c}</b><small>coins</small>`,v:c}];
  const v=await choose('Pick a password to crack 🔓',shuffle(opts));
  if(v!=='hack'){st.earned+=v;floaty('+'+v+' 🪙');return}
  const t=await choose('💻 Who do you hack?',targetOpts(tg.sort((x,y)=>bal(y.uid)-bal(x.uid)),p=>'🪙 '+fmt(bal(p.uid))));
  const amt=Math.max(1,Math.floor(bal(t)*0.2));addHit({kind:'xfer',target:t,amt});floaty('+'+amt+' 🪙');toast(`💻 Hacked ${nm(S.players[t])} for ${amt} coins!`)},
 score:p=>bal(p.uid),show:p=>'🪙 '+fmt(bal(p.uid))},
gold:{cat:'game',name:'Treasure Quest',emoji:'💰',desc:'Right answers open a treasure chest — gold, double, triple… or lose gold, steal from someone, or swap!',
 init:()=>({earned:0}),
 async reward(st){await choose('Pick a chest! 🧰',[0,1,2].map(i=>({html:'🧰',v:i,cls:'chest'})));const b=bal(S.uid);let r=wpick([['add',45],['double',8],['triple',3],['lose25',9],['lose50',4],['steal',14],['swap',5],['nothing',8]]);const tg=others();
  if((r==='steal'||r==='swap')&&!tg.length)r='add';let msg='',sub='';
  if(r==='add'){const g=pick([10,20,25,40,50,75,100]);st.earned+=g;msg=`💰 +${g} gold!`}
  else if(r==='double'){const g=Math.max(b,10);st.earned+=g;msg='✖️2 DOUBLE GOLD!';sub=`+${g}`}
  else if(r==='triple'){const g=Math.max(b*2,20);st.earned+=g;msg='✖️3 TRIPLE GOLD!';sub=`+${g}`}
  else if(r==='lose25'||r==='lose50'){const pc=r==='lose25'?.25:.5;const g=Math.floor(Math.max(0,b)*pc);st.earned-=g;msg=`😬 Lost ${pc*100}% of your gold`;sub=`−${g}`}
  else if(r==='nothing'){msg='🫥 Empty chest… nothing!'}
  else if(r==='steal'){const t=await choose('🦹 STEAL 25% from…',targetOpts(tg.sort((x,y)=>bal(y.uid)-bal(x.uid)),p=>'💰 '+fmt(bal(p.uid))));const amt=Math.floor(Math.max(0,bal(t))*0.25);addHit({kind:'xfer',target:t,amt});msg=`🦹 Stole ${amt} gold from ${esc(nm(S.players[t]))}!`}
  else if(r==='swap'){const t=await choose('🔄 SWAP gold with…',targetOpts(shuffle(tg),p=>'💰 '+fmt(bal(p.uid))));const amt=bal(t)-b;addHit({kind:'xfer',target:t,amt,swap:true});msg=`🔄 Swapped gold with ${esc(nm(S.players[t]))}!`}
  await reveal(msg,sub)},
 score:p=>bal(p.uid),show:p=>'💰 '+fmt(bal(p.uid))},
race:{cat:'game',name:'Turbo Race',emoji:'🏎️',desc:'Each right answer moves your car forward. 3 in a row = NITRO (+2). First across the finish line wins!',goal:true,

 wrong(){return 'Engine stalled 🛞'},extra:()=>trackHTML(),score:goalScore,show:goalShow},
fish:{cat:'game',name:'Deep Sea Fishing',emoji:'🎣',desc:'Right answers let you cast and reel in fish. Find a Lucky Lure for a 3-catch FRENZY (×2)!',
 init:()=>({lbs:0,frenzy:0,fish:[]}),
 async reward(st){await choose('🎣 Something is biting…',[{html:'<span style="font-size:40px">🎣</span>Reel it in!',v:1}]);const f=wpick(FISH.map(x=>[x,x[4]]));
  if(f[1]==='Lucky Lure'){st.frenzy=3;return reveal('🍀 LUCKY LURE!','FRENZY: your next 3 catches are ×2')}
  let lbs=rnd(f[2],f[3]);if(st.frenzy>0){lbs*=2;st.frenzy--}st.lbs+=lbs;st.fish=(st.fish||[]).concat(f[0]).slice(-24);await reveal(`${f[0]} You caught a ${f[1]}!`,`${lbs} lbs${st.frenzy?` · Frenzy left: ${st.frenzy}`:''}`)},
 wrong(){return 'The fish got away 🐟💨'},
 extra:p=>`<div class="inv">${(p.stats.fish||[]).join('')}</div>`,score:p=>p.stats.lbs||0,show:p=>'🎣 '+fmt(p.stats.lbs)+' lbs'},
cafe:{cat:'game',name:'Cafe Rush',emoji:'☕',desc:'Every right answer serves a customer. Streaks earn tips and every 5 customers upgrades your cafe.',
 init:()=>({cash:0,served:0}),
 correct(st){st.served++;const tip=5*Math.min(st.streak,6);const lv=Math.floor(st.served/5);const g=15+lv*10+tip;st.cash+=g;const it=pick(CAFE);floaty('+$'+g);return `${it[0]} Served ${it[1]}! +$${g}${tip?` (tip $${tip})`:''}${st.served%5===0?' · ⬆️ Cafe upgraded!':''}`},
 wrong(){return 'A customer walked out 😤'},
 extra:p=>`<div class="subt" style="margin-top:6px">⭐ Cafe level ${1+Math.floor((p.stats.served||0)/5)} · ${p.stats.served||0} served</div>`,score:p=>p.stats.cash||0,show:p=>'💵 $'+fmt(p.stats.cash)},
dino:{cat:'game',name:'Dino Dig',emoji:'🦕',desc:'Dig for fossils with right answers. Cheat to double your find… but 35% of the time you get caught!',
 init:()=>({fos:0,caught:0}),
 async reward(st){await choose('🦴 Pick a dig site',[0,1,2].map(v=>({html:'🪨',v,cls:'chest'})));const val=pick([10,15,20,25,30,40,60,80,120]);const e=val>=80?'🦖':val>=40?'🦕':val>=20?'💀':'🦴';
  const v=await choose(`${e} Found a fossil worth ${val}!`,[{html:'✅<b>Keep it</b><small>safe</small>',v:'k'},{html:'🔍<b>Cheat</b><small>×2 · 35% risk</small>',v:'c'}]);
  if(v==='k'){st.fos+=val;return floaty('+'+val)}
  if(Math.random()<.35){const loss=Math.floor(st.fos*0.1);st.fos-=loss;st.caught++;return reveal('🚨 CAUGHT CHEATING!',`Fossil confiscated and −${loss}`)}
  st.fos+=val*2;return reveal('😎 Got away with it!','+'+val*2)},
 score:p=>p.stats.fos||0,show:p=>'🦴 '+fmt(p.stats.fos)},
aura:{cat:'ga',name:'Aura Farm',emoji:'✨',desc:'Farm aura with right answers. Combos multiply up to ×5. Wrong answers cost −150 aura. Go from NPC to Infinite Aura ♾️.',
 init:()=>({aura:0,combo:0}),
 correct(st){st.combo=Math.min(5,(st.combo||0)+1);const g=100*st.combo;st.aura+=g;floaty(`+${g} aura`);return `+${g} aura (combo ×${st.combo})`},
 wrong(st){st.aura-=150;st.combo=0;floaty('−150 aura');return '−150 aura 💀'},
 extra:p=>`<div class="subt" style="margin-top:6px">${auraTitle(p.stats.aura||0)}</div>`,score:p=>p.stats.aura||0,show:p=>'✨ '+fmt(p.stats.aura)},
obby:{cat:'ga',name:'Obby Dash',emoji:'🧱',desc:'Parkour obstacle course: right answers jump you to the next platform. Wrong = you fall back to your last checkpoint (every 5).',goal:true,
 init:()=>({pos:0}),
 correct(st){const n=st.streak>=3?2:1;st.pos=Math.min(S.game.goal,st.pos+n);if(st.pos>=S.game.goal&&!st.fin){st.fin=Date.now();S.p.done=true;return '🏆 OBBY COMPLETE!'}return (n>1?'🦘 Double jump! ':'🦘 Jump! ')+(st.pos%5===0?'🚩 Checkpoint!':'')},

 extra:()=>trackHTML(),score:goalScore,show:goalShow},
loot:{cat:'ga',name:'Loot Drop',emoji:'🎁',desc:'Every right answer opens a crate: Common → Rare → Epic → Legendary → Mythic. Streaks boost your odds of rare loot!',
 init:()=>({value:0,inv:[]}),
 async reward(st){await choose('🎁 Open your crate!',[{html:'<span style="font-size:56px">🎁</span>Open',v:1}]);const boost=st.streak>=5?2:st.streak>=3?1.5:1;
  const r=wpick(Object.entries(LOOT).map(([k,x])=>[k,k==='Common'?x.w:x.w*boost]));const it=pick(LOOT[r].items);st.value+=LOOT[r].v;st.inv=(st.inv||[]).concat(it).slice(-30);
  await reveal(`${it} <span class="rar ${r}">${r}</span>`,`+${LOOT[r].v} value`)},
 extra:p=>`<div class="inv">${(p.stats.inv||[]).join('')}</div>`,score:p=>p.stats.value||0,show:p=>'🎁 '+fmt(p.stats.value)},
stream:{cat:'ga',name:'Streamer Rush',emoji:'📱',desc:'Grow your channel: right answers gain followers, streaks can make you GO VIRAL. Wrong answers get you ratio\'d (−10%).',
 init:()=>({fol:0}),
 correct(st){let g=rnd(15,40)+Math.floor(st.fol*0.08);if(st.streak>=3)g=Math.floor(g*1.5);let v='';if(st.streak>=2&&Math.random()<.12){g+=Math.max(g*4,Math.floor(st.fol*0.5));v=' 🚀 WENT VIRAL!'}st.fol+=g;floaty('+'+fmt(g)+' 👥');return `+${fmt(g)} followers${v}`},
 wrong(st){const l=Math.floor(st.fol*0.1);st.fol-=l;return `Ratio'd 😬 −${fmt(l)} followers`},
 extra:p=>`<div class="subt" style="margin-top:6px">${streamBadge(p.stats.fol||0)}</div>`,score:p=>p.stats.fol||0,show:p=>'👥 '+fmt(p.stats.fol)}
};
Object.keys(MODES).forEach(k=>MODES[k].id=k);
const LEDGER_MODES=['royale','hack','gold'];
function modeDefaults(m){return{timeLimit:m==='classic'?0:8,qTime:m==='classic'?20:0}}
function modeCards(clickable){const sec=(cat,title)=>`<div class="sec-title">${title}</div><div class="grid g3">${Object.values(MODES).filter(m=>m.cat===cat).map(m=>`<div class="mode" ${clickable?`onclick="selectMode('${m.id}')"`:''}><div class="em">${m.emoji}</div><h3>${m.name}</h3><p class="muted" style="font-weight:700;margin:8px 0 0;font-size:14px">${m.desc}</p></div>`).join('')}</div>`;
 return sec('game','🎮 Game modes')+sec('ga','✨ Gen Alpha modes')}

/* ================= hosting ================= */
const DRAFT0={mode:null,timeLimit:8,qTime:0,levelMode:'choose',goal:20,shuffleAns:true,showAns:true,lateJoin:true,sound:true};
function hostWith(setId,silent){const s=getSet(setId);if(!s)return toast('Game not found');S.draft=Object.assign({},DRAFT0,{setId:s.builtin?null:s.id,title:s.title,topic:s.topic||'other',questions:s.questions});if(!silent)requireTeacher(()=>go(hostModeView))}
function hostModeView(){return `<div class="sec-title"><span class="link" style="color:#fff" onclick="go(libraryView)">← Library</span> Choose a game mode <small>for "${esc(S.draft.title)}"</small></div>${modeCards(true)}`}
function selectMode(id){S.draft.mode=id;Object.assign(S.draft,modeDefaults(id));go(hostSettingsView)}
function hostSettingsView(){const d=S.draft;if(!d.mode){d.mode='classic';Object.assign(d,modeDefaults('classic'))}const M=MODES[d.mode];const c=lvCounts(d.questions);
 const tog=(k,t)=>`<label class="tog"><input type="checkbox" ${d[k]?'checked':''} onchange="S.draft.${k}=this.checked"> ${t}</label>`;
 return `<div class="sec-title"><span class="link" style="color:#fff" onclick="go(hostModeView)">← Modes</span> ${M.emoji} ${M.name} — options</div>
 <div class="card" style="max-width:780px">
  <p style="font-weight:800;margin-top:0">📚 <span class="nt">${esc(d.title)}</span> — ${d.questions.length} questions (<span class="lv lv1">L1 ${c[1]}</span> <span class="lv lv2">L2 ${c[2]}</span> <span class="lv lv3">L3 ${c[3]}</span>)</p>
  <div class="grid g3" style="gap:12px">
   <div><label>Game length</label><select onchange="S.draft.timeLimit=+this.value">${[[0,M.finite?'Until everyone finishes':'No limit (I end it)'],[3,'3 minutes'],[5,'5 minutes'],[8,'8 minutes'],[10,'10 minutes'],[15,'15 minutes'],[20,'20 minutes']].map(([v,t])=>`<option value="${v}" ${d.timeLimit==v?'selected':''}>${t}</option>`).join('')}</select></div>
   <div><label>Time per question</label><select onchange="S.draft.qTime=+this.value">${[[0,'No timer'],[10,'10 seconds'],[15,'15 seconds'],[20,'20 seconds'],[30,'30 seconds'],[45,'45 seconds'],[60,'60 seconds']].map(([v,t])=>`<option value="${v}" ${d.qTime==v?'selected':''}>${t}</option>`).join('')}</select></div>
   ${M.goal?`<div><label>Finish line</label><select onchange="S.draft.goal=+this.value">${[10,15,20,25,30,40].map(v=>`<option value="${v}" ${d.goal==v?'selected':''}>${v} ${d.mode==='obby'?'platforms':'steps'}</option>`).join('')}</select></div>`:''}
  </div>
  <label>Differentiation — which level does each student get?</label>
  <div class="lvcards" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
   ${[['choose','🙋','Students choose'],['assign','🎯','I assign in lobby'],['1','🌱','Everyone Level 1'],['2','🔥','Everyone Level 2'],['3','🚀','Everyone Level 3']].map(([v,e,t])=>`<div class="lvc ${d.levelMode===v?'on':''}" onclick="S.draft.levelMode='${v}';draw()"><div class="em">${e}</div>${t}</div>`).join('')}
  </div>
  <label>More options</label>
  ${tog('shuffleAns','🔀 Shuffle the answer choices')}${tog('showAns','✅ Show the right answer after each question')}${tog('lateJoin','🚪 Let students join after the game starts')}${tog('sound','🔊 Sound effects')}
  <div style="margin-top:18px"><button class="btn g big" id="cg" onclick="createGame()">🚀 Post game</button></div></div>`}
async function createGame(){const d=S.draft;if(!d||!d.questions||!d.questions.length)return toast('No questions to play');if(!S.user||!S.user.teacher)return requireTeacher(()=>go(hostSettingsView));
 const b=$('#cg');if(b)b.disabled=true;let code;
 try{for(let k=0;k<6;k++){code=String(rnd(100000,999999));const ex=await S.db.doc('games/'+code).get();if(!ex.exists)break}
  await S.db.doc('games/'+code).set({code,hostId:S.uid,mode:d.mode,setId:d.setId||null,setTitle:d.title,topic:d.topic||'other',questions:d.questions.map(q=>({l:q.l,q:q.q,o:q.o,a:q.a,ex:q.ex||'',pic:q.pic||'',img:q.img||null})),status:'lobby',createdAt:Date.now(),
   timeLimit:+d.timeLimit||0,qTime:+d.qTime||0,levelMode:d.levelMode,goal:+d.goal||20,shuffleAns:!!d.shuffleAns,showAns:!!d.showAns,lateJoin:!!d.lateJoin,sound:!!d.sound,assigned:{},kicked:{}});
 }catch(e){if(b)b.disabled=false;return writeErr(e)}
 confetti(16);hostGame(code)}
async function rehost(code){try{const d=await S.db.doc('games/'+code).get();if(!d.exists)return toast('Game not found');const g=d.data();
 S.draft=Object.assign({},DRAFT0,{setId:g.setId||null,title:g.setTitle,topic:g.topic,questions:g.questions,mode:g.mode,timeLimit:g.timeLimit,qTime:g.qTime||0,levelMode:g.levelMode,goal:g.goal||20,shuffleAns:g.shuffleAns!==false,showAns:g.showAns!==false,lateJoin:g.lateJoin!==false,sound:g.sound!==false});go(hostSettingsView)}catch(e){writeErr(e)}}
function hostGame(code){leaveGame();S.role='host';S.code=code;S.htab='board';LS.set('llp_last',{code,role:'host'});
 const t=setTimeout(()=>{if(!S.game)$('#app').innerHTML=`<div class="card empty">Can't reach the game yet. Check your connection. <span class="link" onclick="home()">Home</span></div>`},10000);
 S.unsubs.push(S.db.doc('games/'+code).onSnapshot(d=>{clearTimeout(t);if(!d.exists){S.game=null;LS.set('llp_last',null);$('#app').innerHTML=`<div class="card empty">Game not found. <span class="link" onclick="home()">Home</span></div>`;return}
  S.game=d.data();S.sfxOn=S.game.sound!==false;if(S.game.status==='ended'&&(LS.get('llp_last')||{}).code===code)LS.set('llp_last',null);rerender()},()=>clearTimeout(t)));
 S.unsubs.push(S.db.collection(`games/${code}/players`).onSnapshot(snap=>{S.players={};snap.docs.forEach(d=>{S.players[d.id]=Object.assign({uid:d.id},d.data())});autoEnd();scheduleBoard();rerender()},()=>{}));
 S.unsubs.push(S.db.collection(`games/${code}/hits`).onSnapshot(snap=>{S.hits=snap.docs.map(d=>d.data());rerender()},()=>{}));

async function writeBoard(){S.boardT=null;S.boardAt=Date.now();if(S.role!=='host'||!S.code)return;const players=plist().map(p=>({uid:p.uid,nick:p.nick,avatar:p.avatar,level:p.level,done:!!p.done,stats:p.stats}));const j=JSON.stringify(players);if(j===S.boardLast)return;S.boardLast=j;try{await S.db.doc(`games/${S.code}/live/board`).set({players,at:Date.now()})}catch(e){}}
function plist(){return Object.values(S.players).filter(p=>p&&p.stats)}
function sorted(){const M=MODES[S.game.mode];return plist().sort((a,b)=>M.score(b)-M.score(a))}
function autoEnd(){const g=S.game;if(!g||g.status!=='live'||S.role!=='host')return;const ps=plist();const M=MODES[g.mode];if((M.finite||M.goal)&&ps.length&&ps.every(p=>p.done))endGame()}

function fixAff(a){return a.replace(/\?/g,'؟').replace(/→/g,'\u0001').replace(/←/g,'→').replace(/\u0001/g,'←')}
function trSeg(seg){const m=seg.match(/^(\s*)([\s\S]*?)(\s*)$/);const s=m[2];if(!/[A-Za-z]/.test(s))return seg;
 let r=AR[s];if(r!=null)return m[1]+r+m[3];
 for(const [re,f] of ARP)if(re.test(s))return m[1]+s.replace(re,f)+m[3];
 const k=s.match(/^([^A-Za-z]*)([A-Za-z](?:[\s\S]*[A-Za-z])?)([^A-Za-z]*)$/);
 if(k){r=AR[k[2]];if(r==null)for(const [re,f] of ARP)if(re.test(k[2])){r=k[2].replace(re,f);break}
  if(r!=null)return m[1]+fixAff(k[1])+r+fixAff(k[3])+m[3]}
 return seg}
function trText(t){if(!/[A-Za-z]/.test(t))return t;const tt=t.trim();if(AR[tt]!=null)return t.replace(tt,AR[tt]);return t.split(/( · | — )/).map(p=>/^( · | — )$/.test(p)?p:trSeg(p)).join('')}
function trTextNode(n){const p=n.parentElement;if(!p||p.closest('.nt,script,style,textarea'))return;const v=n.nodeValue;if(!v||v.length>800||!/[A-Za-z]/.test(v))return;const t=trText(v);if(t!==v){n.__en=v;n.nodeValue=t}}
function trNode(root){if(S.lang!=='ar'||!root)return;if(root.nodeType===3)return trTextNode(root);if(root.nodeType!==1||root.closest('.nt,script,style,textarea'))return;
 const els=[root,...root.querySelectorAll('[placeholder],[title]')];
 for(const el of els){if(el.closest('.nt'))continue;for(const at of ['placeholder','title']){const v=el.getAttribute(at);if(v&&!el.hasAttribute('data-en-'+at)){const t=trText(v);if(t!==v){el.setAttribute('data-en-'+at,v);el.setAttribute(at,t)}}}}
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];let n;while((n=w.nextNode()))list.push(n);list.forEach(trTextNode)}
function restoreEn(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))if(n.__en!=null){n.nodeValue=n.__en;delete n.__en}
 for(const at of ['placeholder','title'])root.querySelectorAll('[data-en-'+at+']').forEach(el=>{el.setAttribute(at,el.getAttribute('data-en-'+at));el.removeAttribute('data-en-'+at)})}
function applyLang(){const ar=S.lang==='ar';document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';const b=$('#langb');if(b)b.textContent=ar?'🌐 English':'🌐 عربي';document.title=ar?'هيا نتعلّم ونلعب':"Let's Learn And Play";if(ar)trNode(document.body);else restoreEn(document.body)}
function toggleLang(){S.lang=S.lang==='ar'?'en':'ar';LS.set('llp_lang',S.lang);applyLang()}
new MutationObserver(muts=>{if(S.lang!=='ar')return;for(const m of muts){if(m.type==='characterData')trTextNode(m.target);else m.addedNodes.forEach(trNode)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
